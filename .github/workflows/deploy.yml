name: Deploy Vite App to Pages

on:
  push:
    branches: ['main'] # Pas aan naar "master" als je branch zo heet
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build website
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist' # Zorgt dat GitHub de GEBOUWDE bestanden pakt

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
